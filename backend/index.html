<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscila - Deteksi Mesin AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen font-sans">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">Oscila: Deteksi Kondisi Mesin (AI)</h1>
    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md text-center border border-gray-100">
        <p class="text-gray-500 mb-2">Status Saat Ini:</p>
        <h2 id="prediction-text" class="text-5xl font-extrabold text-orange-500 mb-4 transition-colors duration-300">
            Menunggu...
        </h2>
        <p class="text-xl text-gray-700 mb-6">Tingkat Keyakinan: <span id="confidence-text" class="font-bold">0%</span></p>
        <p id="mode-text" class="text-sm italic text-gray-400">Mode: Menghubungkan...</p>
    </div>
    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/predict');
                const result = await response.json();
                if (result.status === "success") {
                    const data = result.data;
                    const predEl = document.getElementById('prediction-text');
                    predEl.innerText = data.prediction;
                    document.getElementById('confidence-text').innerText = data.confidence_score + '%';
                    document.getElementById('mode-text').innerText = 'Mode: ' + data.mode;
                    if (data.prediction === "Normal") {
                        predEl.className = "text-5xl font-extrabold text-green-500 mb-4";
                    } else if (data.prediction === "Kritis") {
                        predEl.className = "text-5xl font-extrabold text-red-600 mb-4";
                    } else {
                        predEl.className = "text-5xl font-extrabold text-orange-500 mb-4";
                    }
                }
            } catch (error) {
                document.getElementById('mode-text').innerText = "Mode: Gagal terhubung ke Backend";
            }
        }
        setInterval(fetchData, 1000);
        fetchData();
    </script>
</body>
</html>
